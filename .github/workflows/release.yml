name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Tuist
        run: brew install tuist

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Build Release (ad-hoc signed)
        run: |
          xcodebuild \
            -workspace Vignette.xcworkspace \
            -scheme Vignette \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package DMG
        run: |
          ./scripts/make_dmg.sh \
            "build/Build/Products/Release/Vignette.app" \
            "Vignette-${{ steps.version.outputs.version }}.dmg"

      - name: Compute checksum
        id: checksum
        run: |
          SHA256=$(shasum -a 256 "Vignette-${{ steps.version.outputs.version }}.dmg" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Vignette-${{ steps.version.outputs.version }}.dmg" \
            --title "Vignette ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Update Homebrew Cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.checksum.outputs.sha256 }}"
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/vignette.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/vignette.rb

      - name: Commit Cask update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/vignette.rb
          git diff --cached --quiet && echo "no changes" || git commit -m "Update Casks/vignette.rb to v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
